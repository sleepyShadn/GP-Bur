name: appforhumman
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.1
  cloud_firestore: ^6.1.2
  firebase_analytics: ^12.1.2
  firebase_auth: ^6.1.4
  speech_to_text: ^7.3.0
  http: ^1.6.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^20.1.0
  path_provider: ^2.1.5
  printing: ^5.14.3
  v: ^0.0.0-origin.0.1
  pdf: ^3.12.0
  share_plus: ^12.0.1
  flutter_launcher_icons: ^0.14.4
  lottie: ^3.3.3
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  rename: ^3.1.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpeg"
  min_sdk_android: 21 # android min sdk min:16, default 21



